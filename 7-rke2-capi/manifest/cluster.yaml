apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: capi-quickstart
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 10.10.0.0/16
    serviceDomain: myk8s-1.local
    services:
      cidrBlocks:
      - 10.20.0.0/16
  topology:
    classRef:
      name: in-memory
    controlPlane:
      replicas: 3
    version: v1.34.3
    workers:
      machineDeployments:
      - class: default-worker
        name: md-0
        replicas: 3